<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Calculadora</title>
</head>

<body>
    <div id="calculadora">
        <input type="text" id="visor">
        <div id="botoes">
            <button class="btn_num" id="btn_ponto">.</button>
            <button class="funcional" id="btn_c">C</button>
            <button class="funcional" id="btn_ce">CE</button>
            <button class="funcional" id="btn_mais_menos">±</button>
            <button class="btn_num" id="btn_1">1</button>
            <button class="btn_num" id="btn_2">2</button>
            <button class="btn_num" id="btn_3">3</button>
            <button class="operacao" id="btn_mais">+</button>
            <button class="btn_num" id="btn_4">4</button>
            <button class="btn_num" id="btn_5">5</button>
            <button class="btn_num" id="btn_6">6</button>
            <button class="operacao" id="btn_menos">-</button>
            <button class="btn_num" id="btn_7">7</button>
            <button class="btn_num" id="btn_8">8</button>
            <button class="btn_num" id="btn_9">9</button>
            <button class="operacao" id="btn_multiplicar">x</button>
            <button class="btn_num" id="btn_0">0</button>
            <button class="operacao" id="btn_dividir">/</button>
            <button class="operacao" id="btn_igual">=</button>
            <button class="operacao" id="btn_porcento">%</button>
        </div>
    </div>
    <script>
        $(document).ready(function () {
            $('.btn_num, .operacao').click(function () {
                let valorTeclado = $(this).text();
                $('#visor').val($('#visor').val() + valorTeclado);
            });
        });
        //Tecla CE apaga o visor quando é pressionada
        $('#btn_ce').click(function () {
            $('#visor').val('');
        });
        //Tecla C apaga o último caractere do visor quando é pressionada
        $('#btn_c').click(function () {
            let valorAtual = $('#visor').val();
            $('#visor').val(valorAtual.slice(0, -1));
        });
    </script>
</body>

</html>
